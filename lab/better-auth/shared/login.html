<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Datastar + better-auth</title>
<script type="module" src="/datastar.js"></script>
<link rel="stylesheet" href="/styles.css"></head>
<!-- Same rule as the port: the password is a form field, never a signal. -->
<body data-signals="{_busy: false}">
<div class="shell narrow-shell">
  <header><h1>Sign in</h1>
    <p class="muted">Datastar view layer, better-auth sessions
      <span class="badge">better-auth 1.7.2</span></p></header>
  <section class="card pad">
    <div id="login-msg"></div>
    <form data-on:submit__prevent="@post('/login', {contentType: 'form'})" data-indicator:_busy>
      <label><span>Email</span>
        <input type="email" name="email" autocomplete="username" required value="owner@example.com"></label>
      <label><span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required
               value="correct-horse-battery"></label>
      <div class="row">
        <button type="submit" class="btn primary" data-attr:disabled="$_busy"
                data-text="$_busy ? 'Signing in…' : 'Sign in'">Sign in</button>
      </div>
    </form>
  </section>
</div></body></html>
